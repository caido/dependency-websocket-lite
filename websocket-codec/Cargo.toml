[package]
name = "websocket-codec"
description = "A Tokio codec for the websocket protocol"
version = "0.5.2"
authors = ["Tim Robinson <tim.g.robinson@gmail.com>"]
repository = "https://github.com/1tgr/rust-websocket-lite"
license = "MIT"
edition = "2018"
readme = "../README.md"

[features]
default = ["deflate"]
deflate = ["flate2"]

[dependencies]
base64 = "0.22"
byteorder = "1"
bytes = "1"
flate2 = { version = "1", optional = true }
httparse = "1"
rand = "0.8"
sha1 = "0.6"
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }

[dev-dependencies]
assert-allocations = { path = "../assert-allocations" }
criterion = "0.3"
quickcheck = "1"
quickcheck_macros = "1"
static_assertions = "1"
structopt = "0.3"

[[bench]]
name = "bench"
harness = false
